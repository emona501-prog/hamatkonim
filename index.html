<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#b3203f">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-180.png">
<link rel="icon" href="icon-192.png">
<title>המתכונים שלי</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&family=Secular+One&display=swap" rel="stylesheet">
<style>
/* VOICE: חם, ביתי, ברור — כמו מחברת מתכונים של אמא, בכתב גדול
   IDEA: כרטיס מתכון מקופסת המתכונים — לשונית צבעונית לכל חלק
   PICTURE: הכרטיס עצמו: מצרכים עם תיבות סימון, שלבים ממוספרים גדולים
   COLOUR and TYPE: רימון #b3203f, זעפרן #f4b400, נענע #1e9e74; Secular One + Heebo
   LAYOUT: פס עליון מלא, רשת כרטיסים, מתכון בעמודה אחת קריאה */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#170e11);--ink:light-dark(#2a1418,#f6ecee);--soft:light-dark(#7a5a60,#c6aab0);
--card:light-dark(#fdf1f3,#26171b);--line:light-dark(#f0d6db,#3d2629);
--brand:#b3203f;--brand2:light-dark(#8e1531,#e0567a);--sun:#f4b400;--mint:#1e9e74;--fs:19px}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:400 var(--fs)/1.6 Heebo,Arial,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:"Secular One",Heebo,sans-serif;font-weight:400;line-height:1.15;margin:0;text-wrap:balance}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.top{background:var(--brand);color:#fff;padding:14px max(4vw,14px) 18px;position:sticky;top:0;z-index:5;box-shadow:0 4px 18px #0003}
.top .row{display:flex;align-items:center;gap:10px;max-width:1100px;margin:auto}
.top h1{font-size:clamp(24px,6vw,34px);flex:1;cursor:pointer}
.ibtn{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:#ffffff22;color:#fff;flex:none}
.ibtn svg{width:24px;height:24px}
.search{max-width:1100px;margin:12px auto 0;display:flex}
.search input{width:100%;font-size:17px;padding:12px 16px;border-radius:14px;border:0;background:#fff;color:#2a1418}
main{max-width:1100px;margin:auto;padding:18px max(4vw,14px) 120px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px;scrollbar-width:none}
.chip{flex:none;padding:9px 16px;border-radius:99px;background:var(--card);border:1.5px solid var(--line);font-size:16px;font-weight:500}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,138px),1fr));gap:10px}
.rc{background:var(--card);border-radius:20px;overflow:hidden;text-align:start;border:1.5px solid var(--line);display:flex;flex-direction:column;transition:transform .15s}
.rc:active{transform:scale(.98)}
.rc .ph{aspect-ratio:4/3;background:linear-gradient(135deg,var(--brand),#e0567a 60%,var(--sun));display:grid;place-items:center;color:#fff;font:400 44px "Secular One"}
.rc .ph.art{background:radial-gradient(circle at 85% 15%,#ffffff2e 0 22%,transparent 23%),radial-gradient(circle at 10% 95%,#ffffff1f 0 30%,transparent 31%),linear-gradient(150deg,var(--c),color-mix(in srgb,var(--c) 70%,#000));position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:12px;aspect-ratio:1/1}
.rc .ic{width:44%;max-width:84px;color:#fff;opacity:.95}
.rc .ttl{font:400 clamp(18px,5vw,24px)/1.15 "Secular One",sans-serif;color:#fff;text-align:center;text-wrap:balance}
.rc .tmp{position:absolute;top:8px;inset-inline-start:8px;background:#fff;color:var(--c);font:700 13px Heebo;padding:2px 8px;border-radius:99px}
.rc .pv{display:block;color:var(--ink);font-size:14px;line-height:1.35;margin-bottom:2px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.hero .band{background:radial-gradient(circle at 90% 20%,#ffffff26 0 18%,transparent 19%),linear-gradient(150deg,var(--c),color-mix(in srgb,var(--c) 72%,#000));color:#fff;padding:22px 18px;display:flex;align-items:center;gap:14px}
.hero .band h2{color:#fff;flex:1}.bic{width:70px;height:70px;flex:none}
details.orig summary{padding:14px 18px;font-weight:700;cursor:pointer;color:var(--soft)}
.banner{height:150px;border-radius:22px;margin-bottom:14px;background:center/cover;position:relative;overflow:hidden;display:flex;align-items:flex-end}
.banner::before{content:"";position:absolute;inset:0;background:linear-gradient(to top,#000a,#0000 70%)}
.banner span{position:relative;color:#fff;font:400 26px "Secular One",sans-serif;padding:12px 16px}
#splash{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;transition:opacity .35s}
#splash[hidden]{display:none}#splash.out{opacity:0}
.sp-bg{position:absolute;inset:0;background:var(--brand) center/cover}
.sp-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,#000c 0%,#0006 40%,#0000 75%)}
.sp-art{position:absolute;inset:0;display:grid;grid-template-columns:repeat(2,1fr);place-items:center;padding:12vh 10vw 40vh;color:#ffffff3a;background:linear-gradient(160deg,#b3203f,#7a1029)}
.sp-art svg{width:min(30vw,150px)}
.sp-in{position:relative;text-align:center;color:#fff;padding:0 20px max(40px,env(safe-area-inset-bottom));display:grid;gap:10px;justify-items:center}
.sp-logo{width:min(46vw,220px);filter:drop-shadow(0 6px 18px #0007);margin-bottom:4px}
.sp-in h1{font-size:clamp(38px,11vw,64px);text-shadow:0 2px 14px #0008}
.sp-in p{margin:0;font-size:19px}.sp-in small{opacity:.75;font-size:14px}
.sp-go{background:#fff;color:var(--brand);font:400 22px "Secular One",sans-serif;padding:14px 46px;border-radius:99px;box-shadow:0 8px 24px #0005}
@media(prefers-reduced-motion:reduce){#splash{transition:none}}
.rc .ph.pic{position:relative;aspect-ratio:1/1;display:flex;align-items:flex-end}
.rc .ph.pic img{position:absolute;inset:0}
.rc .ph.pic::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,#000c,#0000 55%)}
.rc .ph.pic .ttl{position:relative;z-index:1;padding:10px;width:100%;text-shadow:0 1px 8px #000a}
.rc .ph.pic .tmp{z-index:1}
.hero .band.pic{background:center/cover;min-height:240px;align-items:flex-end;position:relative;cursor:zoom-in}
.hero .band.pic::before{content:"";position:absolute;inset:0;background:linear-gradient(to top,#000c,#0000 60%)}
.hero .band.pic h2{position:relative;text-shadow:0 2px 10px #000a}
.ing.opt.have .t{text-decoration:none;color:inherit}
#tchip{position:fixed;bottom:max(24px,env(safe-area-inset-bottom));right:16px;z-index:7;background:var(--mint);color:#fff;font:700 20px Heebo;padding:12px 18px;border-radius:99px;box-shadow:0 6px 18px #0004;cursor:pointer}
#tchip[hidden],#alarm[hidden]{display:none}
#alarm.full{position:fixed;inset:0;z-index:60;background:var(--brand);color:#fff;display:grid;place-items:center;text-align:center;animation:pl 1s infinite alternate}
#alarm.full h2{font-size:44px;margin:10px 0}#alarm.full p{font-size:22px;margin:0 0 24px}.al-ic{font-size:80px}
@keyframes pl{to{background:#7a1029}}
#alarm.top{position:fixed;top:0;left:0;right:0;z-index:60;background:var(--sun);color:#2a1418;display:flex;align-items:center;gap:10px;padding:max(14px,env(safe-area-inset-top)) 16px 14px;font:700 18px Heebo;box-shadow:0 4px 14px #0004}
#alarm.top span{flex:1}#alarm.top button{background:#2a1418;color:#fff;border-radius:12px;padding:10px 16px;font-weight:700}
.trow{display:flex;align-items:center;gap:6px;padding:8px 0;border-bottom:1px dashed var(--line)}.trow div{flex:1;display:grid}.trow b{font-size:26px}.trow small{color:var(--soft)}.trow .btn{min-height:40px;padding:6px 10px}
@media(prefers-reduced-motion:reduce){#alarm.full{animation:none}}
.rc .ph img{width:100%;height:100%;object-fit:cover;object-position:center 20%}
.rc .tx{padding:10px 12px 12px}.rc h3{font-size:19px}
.rc small{color:var(--soft);font-size:15px}
.empty{text-align:center;padding:40px 10px;color:var(--soft)}
.empty svg{width:120px;height:120px}
.fab{position:fixed;bottom:max(20px,env(safe-area-inset-bottom));left:20px;background:var(--brand);color:#fff;border-radius:99px;padding:16px 24px;font:400 20px "Secular One";display:flex;gap:10px;align-items:center;box-shadow:0 8px 24px #b3203f66;z-index:6}
.fab svg{width:26px;height:26px}
/* recipe view */
.hero{border-radius:24px;overflow:hidden;background:var(--card);margin-bottom:16px}
.hero img{width:100%;max-height:340px;object-fit:cover;display:block}
.hero .tx{padding:18px}
.hero h2{font-size:clamp(30px,7vw,44px);color:var(--brand2)}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.badge{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:12px;background:var(--bg);border:1.5px solid var(--line);font-size:16px;font-weight:500;white-space:nowrap}
.badge.cup{background:#e6f5ef;color:#14684d;border-color:#bfe5d6}
.badge.oven{background:var(--sun);color:#2a1418;border-color:var(--sun)}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
.btn{min-height:46px;padding:10px 16px;border-radius:14px;background:var(--card);border:1.5px solid var(--line);font-size:16px;font-weight:500;display:inline-flex;align-items:center;gap:7px}
.btn.pri{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.ok{background:var(--mint);color:#fff;border-color:var(--mint)}
.btn svg{width:20px;height:20px}
.sec{border-radius:22px;background:var(--card);margin-bottom:16px;overflow:hidden;border:1.5px solid var(--line)}
.sec>h3{font-size:26px;padding:14px 18px;color:#fff;display:flex;align-items:center;gap:10px}
.sec.s1>h3{background:var(--brand)}.sec.s2>h3{background:#d35400}.sec.s3>h3{background:#c98f00;color:#2a1418}.sec.s4>h3{background:#7b3fa0}
.sec>h3 span{margin-inline-start:auto;font:500 15px Heebo;background:#ffffff33;padding:3px 10px;border-radius:99px}
.sec .in{padding:8px 16px 16px}
.grp{font:400 21px "Secular One";color:var(--brand2);margin:14px 0 4px}
.ing{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:start;padding:10px 4px;border-bottom:1px dashed var(--line)}
.ing:last-child{border:0}
.box{flex:none;width:30px;height:30px;border-radius:9px;border:2.5px solid var(--soft);display:grid;place-items:center;margin-top:2px}
.ing.have .box{background:var(--mint);border-color:var(--mint);color:#fff}
.ing.have .t{color:var(--soft);text-decoration:line-through;text-decoration-color:var(--mint)}
.box svg{width:20px;height:20px}
.step{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:start;padding:12px 2px;border-bottom:1px dashed var(--line)}
.step:last-child{border:0}
.num{flex:none;width:40px;height:40px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font:400 21px "Secular One"}
.step.done{opacity:.45}.step.done .num{background:var(--mint)}
.tip{display:flex;gap:10px;padding:10px 2px;border-bottom:1px dashed var(--line)}
.tip:last-child{border:0}.tip b{color:#c98f00;font-size:24px;line-height:1.2}
.prog{height:10px;border-radius:9px;background:var(--line);margin:4px 0 10px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--mint);transition:width .3s}
.missing{background:var(--bg);border-radius:16px;padding:12px 14px;margin-top:10px;border:2px solid var(--sun)}
.scans{display:flex;gap:10px;overflow-x:auto;padding:4px 0}
.scans img{height:150px;border-radius:12px;cursor:zoom-in;flex:none}
/* forms */
.f{display:grid;gap:14px}
label{font-weight:700;font-size:17px;display:grid;gap:6px}
label small{font-weight:400;color:var(--soft);font-size:14px}
input[type=text],input[type=password],textarea,select{width:100%;font-size:17px;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg)}
textarea{min-height:140px;line-height:1.6;resize:vertical}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.drop{border:3px dashed var(--brand);border-radius:22px;padding:26px 16px;text-align:center;background:var(--card)}
.drop h3{font-size:26px;color:var(--brand2);margin:8px 0}
.drop svg{width:64px;height:64px;color:var(--brand)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;justify-content:center}
.thumbs div{position:relative}.thumbs img{width:84px;height:84px;object-fit:cover;border-radius:12px}
.thumbs button{position:absolute;top:-6px;left:-6px;width:28px;height:28px;border-radius:50%;background:var(--brand);color:#fff;font-weight:700}
.busy{display:flex;flex-direction:column;align-items:center;gap:14px;padding:40px 10px;text-align:center}
.spin{width:64px;height:64px;border-radius:50%;border:7px solid var(--line);border-top-color:var(--brand);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.spin{animation-duration:4s}.rc{transition:none}}
.note{font-size:15px;color:var(--soft)}
.modal{position:fixed;inset:0;background:#000a;display:grid;place-items:center;z-index:20;padding:16px}
.modal .m{background:var(--bg);border-radius:22px;padding:20px;max-width:440px;width:100%}
.modal img{max-width:100%;max-height:86vh;border-radius:12px}
.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:14px;z-index:30;font-size:16px}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--brand2);font-weight:700;margin-bottom:12px;min-height:44px}
.cook .ing,.cook .step{font-size:1.15em}
</style>
</head>
<body>
<header class="top">
  <div class="row">
    <h1 id="appName" title="לדף הבית">המתכונים שלי</h1>
    <button class="ibtn" id="timerBtn" aria-label="טיימר"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/></svg></button>
    <button class="ibtn" id="shopBtn" aria-label="רשימת קניות"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.5L21 8H6"/><circle cx="10" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/></svg></button>
    <button class="ibtn" id="setBtn" aria-label="הגדרות"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </div>
  <div class="search" id="searchWrap"><input id="q" type="search" placeholder="חיפוש מתכון או מצרך..." aria-label="חיפוש"></div>
</header>
<div id="splash" hidden></div>
<div id="tchip" hidden></div><div id="alarm" hidden></div>
<main id="main"></main>
<input type="file" id="bgIn" accept="image/*" multiple hidden>
<button class="fab" id="fab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>מתכון חדש</button>
<input type="file" id="fileIn" accept="image/*" multiple hidden>
<input type="file" id="docIn" accept=".pdf,.docx,.txt,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document,text/plain" hidden>
<input type="file" id="dishIn" accept="image/*" hidden>
<input type="file" id="importIn" accept=".json,application/json" hidden>

<script>
{
const CATS=['עוגות','עוגיות','מאפים ולחמים','קינוחים','מחבת וטיגון','מנות עיקריות','תוספות','סלטים','מרקים','שבת וחג','אחר'];
const IC={
cake:'<path d="M8 40h32V27H8z"/><path d="M8 33c3 3 7 3 10 0s7-3 10 0 7 3 12 0"/><path d="M15 27v-6M24 27v-7M33 27v-6"/><path d="M24 15c-2-2 0-5 0-5s2 3 0 5"/>',
cookie:'<circle cx="24" cy="24" r="15"/><circle cx="19" cy="19" r="1.8"/><circle cx="29" cy="21" r="1.8"/><circle cx="21" cy="29" r="1.8"/><circle cx="30" cy="30" r="1.8"/>',
bread:'<path d="M10 36V22a8 8 0 0 1 4-14h20a8 8 0 0 1 4 14v14z"/><path d="M19 15l-3 5M26 15l-3 5M33 15l-3 5"/>',
cup:'<path d="M12 24h24l-3 16H15z"/><path d="M12 24a12 12 0 0 1 24 0"/><path d="M24 12v-4"/><path d="M19 30v6M24 30v6M29 30v6"/>',
pan:'<circle cx="20" cy="26" r="12"/><path d="M32 26h12"/><circle cx="20" cy="26" r="5"/>',
pot:'<path d="M9 22h30v12a6 6 0 0 1-6 6H15a6 6 0 0 1-6-6z"/><path d="M5 22h38M18 16c0-3 3-3 3-6M27 16c0-3 3-3 3-6"/>',
leaf:'<path d="M10 38C10 20 22 10 38 10c0 16-10 28-28 28z"/><path d="M10 38L28 20"/>',
bowl:'<path d="M7 24h34a17 17 0 0 1-34 0z"/><path d="M18 18c0-3 3-3 3-6M27 18c0-3 3-3 3-6"/>',
candle:'<path d="M15 40V22h7v18M26 40V22h7v18"/><path d="M18.5 16c-2-2 0-5 0-5s2 3 0 5M29.5 16c-2-2 0-5 0-5s2 3 0 5"/><path d="M10 40h28"/>',
whisk:'<path d="M24 44V30"/><path d="M24 30c-8-4-10-14-6-22 4 0 6 14 6 22 0-8 2-22 6-22 4 8 2 18-6 22z"/>'};
const THEME={'עוגות':['#b3203f','cake'],'עוגיות':['#c75a12','cookie'],'מאפים ולחמים':['#9a5b2e','bread'],'קינוחים':['#7b3fa0','cup'],'מחבת וטיגון':['#c28a00','pan'],'מנות עיקריות':['#1e7a5a','pot'],'תוספות':['#3d8b3d','leaf'],'סלטים':['#3d8b3d','leaf'],'מרקים':['#2f6f9f','bowl'],'שבת וחג':['#26408b','candle'],'אחר':['#6b4c55','whisk']};
const PICS=Object.fromEntries('s01 s02 s03 s04 s05 s06 s07 s08 s09 s10 s11 s12 s13 s14 s15 s16 s17 s18 s19'.split(' ').map(i=>[i,'img/'+i+'.jpg']));
const CATBG={'עוגות':'img/bg-cakes.jpg','עוגיות':'img/bg-cookies.jpg','מחבת וטיגון':'img/bg-pan.jpg','מנות עיקריות':'img/bg-meals.jpg','קינוחים':'img/bg-main.jpg'};
const DEFBG=['img/bg-main.jpg','img/bg-cakes.jpg','img/bg-cookies.jpg','img/bg-pan.jpg'];
const picOf=r=>r.dish||r.pic||PICS[r.id]||'';
const theme=c=>THEME[c]||THEME['אחר'];

const PROMPT=`אתה מומחה לפענוח מתכונים. בתמונות מצורף מתכון (מודפס או בכתב יד, ייתכן בכמה עמודים — אחד אותם למתכון אחד).

"steps":[{"group":"שם השלב (הכנת הבצק...) או ריק","items":["הוראה אחת בכל פריט, בלשון ברורה"]}],
"finish":[{"group":"למשל: סירופ / ציפוי / מילוי / קישוט / הגשה","items":["הוראות של מה שעושים בסוף"]}],
"tips":["נקודות חשובות לשים לב אליהן, אזהרות, טיפים"]}
כללים: כל המצרכים (כולל של סירופ/ציפוי/מילוי) נכנסים ל-ingredients בקבוצות נפרדות; ב-finish רק ההוראות של מה שעושים בסוף. מילה שמחוקה בקו (בעט או עיפרון) — אל תכלול. תיקון בכתב יד — העדף אותו. תקן שגיאות כתיב ברורות. אל תמציא דבר שלא כתוב; שדה שאין עליו מידע — מחרוזת ריקה או מערך ריק. אם יש בתמונה צילום של המאכל ולא טקסט — התעלם ממנו.`;

function parseJSON(t){if(typeof t!=='string')return t;const a=t.indexOf('{'),b=t.lastIndexOf('}');return JSON.parse(t.slice(a,b+1))}
async function aiParse(images){

    catch(e){if(e&&e.code==='not_granted')throw new Error('לא ניתן אישור לשימוש ב-Claude');const r=await sampleFn(PROMPT,{images:blobs,modelTier:'complex'});out=parseJSON(r.text)}
    return parseJSON(out);
  }
  if(settings.gkey){

    const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(settings.gmodel||'gemini-2.5-flash')}:generateContent?key=${encodeURIComponent(settings.gkey)}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts}],generationConfig:{responseMimeType:'application/json',temperature:.2}})});
    if(!r.ok)throw new Error('שגיאה מהשרת ('+r.status+') — בדוק את המפתח בהגדרות');

}
const PROMPT_T=PROMPT.replace('בתמונות מצורף מתכון (מודפס או בכתב יד, ייתכן בכמה עמודים — אחד אותם למתכון אחד).','בטקסט שלמטה (שחולץ מקובץ) יש מתכון אחד או יותר. שורות עשויות להיות שבורות באמצע משפט — חבר אותן.')
  .replace('החזר JSON בלבד, בעברית, במבנה הזה בדיוק:','החזר JSON בלבד, בעברית: {"recipes":[ ...מתכון לכל מתכון בטקסט... ]} כשכל מתכון במבנה הזה:')+'\n\nהטקסט:\n';
async function aiText(text){

  if(sampleFn){try{j=await sampleFn.json(prompt,{modelTier:'complex'})}catch(e){if(e&&e.code==='not_granted')throw new Error('לא ניתן אישור לשימוש ב-Claude');const r=await sampleFn(prompt,{modelTier:'complex'});j=parseJSON(r.text)}j=parseJSON(j)}
  else if(settings.gkey){const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(settings.gmodel||'gemini-2.5-flash')}:generateContent?key=${encodeURIComponent(settings.gkey)}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:prompt}]}],generationConfig:{responseMimeType:'application/json',temperature:.2}})});
    if(!r.ok)throw new Error('שגיאה מהשרת ('+r.status+') — בדוק את המפתח בהגדרות');const x=await r.json();j=parseJSON(x.candidates?.[0]?.content?.parts?.map(p=>p.text).join('')||'{}')}

}
function loadScript(src){return new Promise((res,rej)=>{if(document.querySelector(`script[src="${src}"]`))return res();const t=document.createElement('script');t.src=src;t.onload=res;t.onerror=()=>rej(new Error('לא הצלחתי לטעון רכיב לקריאת הקובץ (צריך אינטרנט)'));document.head.append(t)})}
async function docxText(f){await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js');const z=await JSZip.loadAsync(f);const x=await z.file('word/document.xml').async('string');

async function pdfData(f){const B='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';await loadScript(B+'pdf.min.js');await loadScript(B+'pdf.worker.min.js');
  pdfjsLib.GlobalWorkerOptions.workerSrc=B+'pdf.worker.min.js';const doc=await pdfjsLib.getDocument({data:new Uint8Array(await f.arrayBuffer())}).promise;let out=[];
  for(let i=1;i<=doc.numPages;i++){const pg=await doc.getPage(i);const tc=await pg.getTextContent();const rows=[];
    tc.items.forEach(it=>{if(!it.str)return;const y=Math.round(it.transform[5]);let row=rows.find(r=>Math.abs(r.y-y)<3);if(!row){row={y,its:[]};rows.push(row)}row.its.push(it)});
    rows.sort((a,b)=>b.y-a.y).forEach(r=>{const heb=r.its.some(t=>/[֐-׿]/.test(t.str));r.its.sort((a,b)=>heb?b.transform[4]-a.transform[4]:a.transform[4]-b.transform[4]);out.push(r.its.map(t=>t.str).join(' ').replace(/\s+/g,' ').trim())});out.push('')}
  const text=out.join('\n');if(text.replace(/\s/g,'').length>30)return {text};
  const imgs=[];for(let i=1;i<=Math.min(doc.numPages,6);i++){const pg=await doc.getPage(i);const v=pg.getViewport({scale:2});const c=document.createElement('canvas');c.width=v.width;c.height=v.height;await pg.render({canvasContext:c.getContext('2d'),viewport:v}).promise;imgs.push(c.toDataURL('image/jpeg',.85))}
  return {images:imgs}}
const busy=(t,s)=>{main.innerHTML=`<div class="busy"><div class="spin"></div><h2 style="font-size:26px">${t}</h2><p class="note">${s||''}</p></div>`};
async function importFile(f){const n=f.name.toLowerCase();busy('קורא את הקובץ...','מחלץ את הטקסט');

async function doParseText(text){busy('מסדר את המתכון...','מפרק למצרכים, שלבים, דגשים וסיום');
  let list;try{list=(await aiText(text)).filter(x=>x&&(x.title||x.ingredients?.length))}catch(e){if(e.message!=='NOAI'){toast(e.message);}list=null}

  const made=list.map(j=>{const r=normalize(j,{id:uid(),created:Date.now()});r.scans=[];return r});recipes=[...made,...recipes];saveAll();
  if(made.length===1){toast('המתכון מוכן! בדוק שהכל נכון');go({v:'recipe',id:made[0].id,k:1})}else{toast('נוספו '+made.length+' מתכונים');go({v:'home',cat:'הכל'})}}
function pasteBox(){const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="m"><h3 style="font-size:22px;margin-bottom:10px">הדבק כאן את טקסט המתכון</h3><textarea id="pt" style="min-height:220px"></textarea><div class="tools" style="margin:12px 0 0"><button class="btn pri" data-y>סדר את המתכון</button><button class="btn" data-n>ביטול</button></div></div>`;document.body.append(m);

function guessCat(t){return /עוגי/.test(t)?'עוגיות':/עוג|רולד|בראוני|טארט|פאי/.test(t)?'עוגות':/פנקייק|קרפ|ספינג|מופלט|לביב|וופל|סופגני/.test(t)?'מחבת וטיגון':/לחם|חל[הות]|מאפ|פיצ|בורקס|לחמני/.test(t)?'מאפים ולחמים':/מרק/.test(t)?'מרקים':/סלט/.test(t)?'סלטים':/קינוח|מוס|פודינג|גלידה/.test(t)?'קינוחים':/עוף|בשר|דג|קציצ|מעקוד|פשטיד/.test(t)?'מנות עיקריות':'אחר'}
function localParseAll(text){const L=text.split(/\r?\n/).map(x=>x.trim());const starts=[];
  const isHead=x=>/^(מצרכים|מוצרים|רכיבים)\s*[:：]?$/.test(x.replace(/[★📌]/g,'').trim())||/^[★⭐]?\s*(חשוב להשתמש ב)?כוס (שתי+ה|מדידה|מידה)/.test(x);
  for(let i=0;i<L.length;i++){if(!L[i]||/^(בס"?ד|ב"ה)$/.test(L[i]))continue;const prevBlank=i===0||!L[i-1]||starts.length===0;if(!prevBlank||isHead(L[i]))continue;
    const nxt=L.slice(i+1,i+5).filter(Boolean).slice(0,3);if(nxt.some(isHead))starts.push(i)}
  if(starts.length<2)return [localParse(text)];
  return starts.map((st,k)=>localParse(L.slice(k?st:0,starts[k+1]??L.length).join('\n')))}
function localParse(text){
  const lines=text.split(/\r?\n/).map(s=>s.replace(/[★⭐☆✓•▪📌🍪❤♥]/g,'').replace(/\s+/g,' ').trim()).filter(Boolean).filter(l=>!/^(בס"?ד|ב"ה|בתאבון!*|לשובע+)$/.test(l));
  const r={title:'',category:'אחר',servings:'',time:'',intro:'',measure:'',ovenTemp:'',bakeTime:'',ingredients:[],steps:[],finish:[],tips:[],have:{},done:{},scans:[]};
  let mode='ing',cur=null;const grp=(arr,g)=>{cur={group:g,items:[]};arr.push(cur)};
  const ingRe=/^(\d|½|¼|¾|⅓|⅔|חצי|רבע|שליש|כוס|כף|כפית|שקית|חבילת|קופסת|קורט|קצת|מעט|\d+ ?גרם)/;
  for(const l of lines){const h=l.replace(/\s*[:：]\s*$/,'').trim(),words=l.split(' ').length;
    if(!r.title){r.title=h.replace(/^מתכון (מוצלח )?ל/,'');continue}
    if(/כוס (שתי+ה|מדידה|מידה)/.test(l)&&words<8&&!r.measure){r.measure=h.replace(/^(חשוב )?(להשתמש )?ב/,'');continue}
    if(/^(מצרכים|מוצרים|רכיבים|מרכיבים)$/.test(h)){mode='ing';cur=null;continue}
    if(/^(אופן ה?הכנה|ההכנה|הכנה|הוראות( הכנה)?)$/.test(h)){mode='step';cur=null;continue}
    if(/^(חשוב|טיפים?|הערות?|דגשים)!*$/.test(h)){mode='tip';continue}
    if(/[:：]$/.test(l)&&words<=4){if(/^ל(סירופ|ציפוי|מילוי|קישוט|זילוף|גנאש|קרם|בצק|שכב)/.test(h)||mode==='ing'){mode='ing';grp(r.ingredients,h)}else grp(r.steps,h);continue}
    if(mode==='ing'&&!ingRe.test(l)&&words>=3&&r.ingredients.length){mode='step';cur=null}
    if(mode==='tip'){r.tips.push(l.replace(/^[-*]\s*/,''));continue}
    if(mode==='step'){if(!cur||!r.steps.includes(cur))grp(r.steps,'');cur.items.push(l.replace(/^\d+[.)]\s*/,''))}
    else{if(!cur||!r.ingredients.includes(cur))grp(r.ingredients,'');cur.items.push(l)}}
  const all=lines.join(' ');let m;
  if(m=all.match(/(\d{3})\s*°|°\s*(\d{3})|(\d{3})\s*מעלות/)){r.ovenTemp=(m[1]||m[2]||m[3])+'°';const after=all.slice(m.index);const t=after.match(/(\d+\s*[-–]\s*\d+|\d+)\s*דקות/);if(t)r.bakeTime=t[1].replace(/\s/g,'')+' דקות'}
  r.category=guessCat(r.title);r.ingredients=r.ingredients.filter(g=>g.items.length);r.steps=r.steps.filter(g=>g.items.length);if(!r.title)r.title='מתכון ללא שם';return r}
const clean=g=>(Array.isArray(g)?g:[]).map(x=>typeof x==='string'?{group:'',items:[x]}:{group:String(x.group||''),items:(x.items||[]).map(String).filter(Boolean)}).filter(x=>x.items.length);
function normalize(j,base={}){return {...base,title:j.title||base.title||'מתכון ללא שם',category:CATS.includes(j.category)?j.category:(base.category||'אחר'),servings:j.servings||'',time:j.time||'',measure:j.measure||'',ovenTemp:j.ovenTemp||'',bakeTime:j.bakeTime||'',intro:j.intro||'',ingredients:clean(j.ingredients),steps:clean(j.steps),finish:clean(j.finish),tips:(j.tips||[]).map(String).filter(Boolean),have:{},done:{}}}

/* ---------- text <-> groups (editor) ---------- */
const toText=gs=>(gs||[]).map(g=>(g.group?'# '+g.group+'\n':'')+g.items.join('\n')).join('\n');
function fromText(t){const out=[];let cur=null;t.split('\n').map(s=>s.trim()).filter(Boolean).forEach(l=>{if(l.startsWith('#')||(/[:：]$/.test(l)&&l.length<30)){cur={group:l.replace(/^#\s*/,'').replace(/[:：]$/,''),items:[]};out.push(cur)}else{if(!cur){cur={group:'',items:[]};out.push(cur)}cur.items.push(l)}});return out.filter(g=>g.items.length)}

/* ---------- scaling ---------- */
const FR={'½':.5,'¼':.25,'¾':.75,'⅓':1/3,'⅔':2/3},HW={'חצי':.5,'רבע':.25,'שליש':1/3},PL={'כוס':'כוסות','כף':'כפות','כפית':'כפיות','שקית':'שקיות','חבילת':'חבילות','קופסת':'קופסאות','ביצה':'ביצים'};
function fmt(n){const w=Math.floor(n+1e-9),f=n-w;const m=[[.125,'⅛'],[.25,'¼'],[1/3,'⅓'],[.375,'⅜'],[.5,'½'],[.625,'⅝'],[2/3,'⅔'],[.75,'¾'],[.875,'⅞']].find(([v])=>Math.abs(v-f)<.02);if(f<.02)return String(w);if(f>.98)return String(w+1);return m?(w?w+m[1]:m[1]):String(Math.round(n*10)/10)}
function plur(rest,v){if(v<=1)return rest;return rest.replace(/^(\S+)/,w=>PL[w]||w)}
function scale(line,k){if(k===1)return line;let m;const L=line.trim();
  if(m=L.match(/^(\d+(?:\.\d+)?)\s*[-–]\s*(\d+(?:\.\d+)?)\s+(.*)$/))return fmt(m[1]*k)+'–'+fmt(m[2]*k)+' '+m[3];
  if(m=L.match(/^(\d+(?:\.\d+)?)\s*ו(חצי|רבע)\s+(.*)$/)){const v=(+m[1]+HW[m[2]])*k;return fmt(v)+' '+plur(m[3],v)}
  if(m=L.match(/^(\d+)\/(\d+)\s+(.*)$/)){const v=m[1]/m[2]*k;return fmt(v)+' '+plur(m[3],v)}
  if(m=L.match(/^(\d+)?\s*([½¼¾⅓⅔])\s+(.*)$/)){const v=((m[1]?+m[1]:0)+FR[m[2]])*k;return fmt(v)+' '+plur(m[3],v)}
  if(m=L.match(/^(\d+(?:\.\d+)?)\s+(.*)$/)){const v=+m[1]*k;return fmt(v)+' '+plur(m[2],v)}
  if(m=L.match(/^(חצי|רבע|שליש)\s+(.*)$/)){const v=HW[m[1]]*k;return fmt(v)+' '+plur(m[2],v)}
  if(m=L.match(/^(כוס|כף|כפית)\s+ו(חצי|רבע)\s+(.*)$/)){const v=(1+HW[m[2]])*k;return fmt(v)+' '+plur(m[1],v)+' '+m[3]}
  if(m=L.match(/^(כוס|כף|כפית|שקית|חבילת|קופסת|ביצה)(\s.*)?$/)){const v=k;return fmt(v)+' '+plur(m[1],v)+(m[2]||'')}
  return line}

  <label>מודל Gemini<input type="text" name="gmodel" value="${esc(settings.gmodel)}" dir="ltr"></label>

/* ---------- share & print ---------- */
function recipeText(r,k=1){const L=[];L.push('🍰 '+r.title);if(r.measure)L.push('מודדים ב'+r.measure);if(r.ovenTemp||r.bakeTime)L.push('תנור: '+[r.ovenTemp,r.bakeTime].filter(Boolean).join(' · '));
  const sect=(t,gs,sc)=>{if(!gs.length)return;L.push('','*'+t+'*');gs.forEach(g=>{if(g.group)L.push('— '+g.group+' —');g.items.forEach(i=>L.push('• '+(sc?scale(i,k):i)))})};
  sect('מצרכים',r.ingredients,true);sect('אופן ההכנה',r.steps);if(r.tips.length){L.push('','*נקודות חשובות*');r.tips.forEach(t=>L.push('! '+t))}sect('בסוף',r.finish);L.push('','— '+settings.name);return L.join('\n')}
function printHTML(list){const one=r=>{const sec=(t,gs,num)=>gs.length?`<h2>${t}</h2>`+gs.map(g=>(g.group?`<h3>${esc(g.group)}</h3>`:'')+(num?'<ol>':'<ul>')+g.items.map(i=>`<li>${esc(i)}</li>`).join('')+(num?'</ol>':'</ul>')).join(''):'';
  return `<article><h1>${esc(r.title)}</h1><p class="m">${[r.category,r.ovenTemp&&'תנור '+r.ovenTemp,r.bakeTime&&'אפייה '+r.bakeTime,r.measure&&'מודדים ב'+r.measure].filter(Boolean).map(esc).join(' · ')}</p>${r.dish?`<img src="${r.dish}">`:''}${sec('מצרכים',r.ingredients)}${sec('אופן ההכנה',r.steps,1)}${r.tips.length?'<h2>נקודות חשובות</h2><ul>'+r.tips.map(t=>`<li>${esc(t)}</li>`).join('')+'</ul>':''}${sec('בסוף',r.finish)}</article>`};
  return `<!DOCTYPE html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(list.length===1?list[0].title:settings.name)}</title><style>body{font:16px/1.6 Arial,sans-serif;color:#222;max-width:720px;margin:20px auto;padding:0 16px}h1{color:#b3203f;margin:0;font-size:30px}h2{font-size:20px;border-bottom:2px solid #b3203f;padding-bottom:2px;margin:18px 0 6px}h3{font-size:16px;margin:10px 0 2px;color:#8e1531}.m{color:#666;margin:4px 0 8px}ul{list-style:"☐  "}li{margin:3px 0}img{max-width:100%;max-height:260px;border-radius:10px}article{page-break-after:always;margin-bottom:30px}.foot{color:#999;font-size:12px;text-align:center}</style></head><body>${list.map(one).join('')}<p class="foot">${esc(settings.name)} · חי אפליקציות</p><script>setTimeout(()=>{try{print()}catch(e){}},400)<\/script></body></html>`}
async function doPrint(list){const html=printHTML(list);const name=(list.length===1?list[0].title:'כל המתכונים')+'.html';
  let dl=null;try{dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null}catch(e){}
  if(dl){try{await dl.save({filename:name,data:html});toast('נשמר קובץ — פתח אותו ובחר הדפסה')}catch(e){toast('השמירה בוטלה')}return}
  const f=document.createElement('iframe');f.style.cssText='position:fixed;width:0;height:0;border:0';document.body.append(f);f.contentDocument.open();f.contentDocument.write(html.replace(/<script>[\s\S]*?<\/script>/,''));f.contentDocument.close();
  setTimeout(()=>{try{f.contentWindow.focus();f.contentWindow.print()}catch(e){toast('ההדפסה לא נתמכת כאן')}setTimeout(()=>f.remove(),60000)},500)}
function shareMenu(r){const k=view.k||1,txt=recipeText(r,k);const m=document.createElement('div');m.className='modal';
  m.innerHTML=`<div class="m"><h3 style="font-size:24px;margin-bottom:14px">שיתוף: ${esc(r.title)}</h3><div class="f"><a class="btn ok" href="https://wa.me/?text=${encodeURIComponent(txt)}" target="_blank" rel="noopener">${ICON.wa} שליחה בוואטסאפ</a><button class="btn" data-copy>העתקת המתכון</button><button class="btn" data-native>שיתוף לאפליקציה אחרת</button><button class="btn" data-n>סגירה</button></div></div>`;
  document.body.append(m);m.onclick=async e=>{if(e.target===m||e.target.closest('[data-n]'))m.remove();
    else if(e.target.closest('[data-copy]')){try{await navigator.clipboard.writeText(txt);toast('המתכון הועתק')}catch(err){toast('לא הצלחתי להעתיק')}}
    else if(e.target.closest('[data-native]')){try{await navigator.share({title:r.title,text:txt})}catch(err){try{await navigator.clipboard.writeText(txt);toast('השיתוף לא זמין כאן — המתכון הועתק')}catch(e2){toast('השיתוף לא זמין כאן')}}}}}

/* ---------- timers ---------- */
const APP_URL='https://emona501-prog.github.io/hamatkonim/';
const alertCfg=()=>({vib:true,sound:true,full:true,top:false,...(settings.alert||{})});
let timers=[];try{timers=JSON.parse(localStorage.getItem('rc_timers')||'[]')}catch(e){}
const saveTimers=()=>{try{localStorage.setItem('rc_timers',JSON.stringify(timers))}catch(e){}};
function bakeMin(r){const m=(r.bakeTime||'').match(/(\d+)/);if(m)return +m[1];if(/שעה/.test(r.bakeTime||''))return 60;return 0}
const fmtT=ms=>{const t=Math.max(0,Math.ceil(ms/1000)),h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=t%60;return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(s).padStart(2,'0')};
let actx=null,beepI=null,vibI=null,wl2=null;
function unlockAudio(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume()}catch(e){}}
function beep(){if(!actx)return;try{[0,.25,.5].forEach(o=>{const g=actx.createGain(),os=actx.createOscillator();os.type='square';os.frequency.value=880;g.gain.setValueAtTime(.0001,actx.currentTime+o);g.gain.exponentialRampToValueAtTime(.25,actx.currentTime+o+.02);g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+o+.18);os.connect(g).connect(actx.destination);os.start(actx.currentTime+o);os.stop(actx.currentTime+o+.2)})}catch(e){}}
function stopAlarm(){clearInterval(beepI);clearInterval(vibI);beepI=vibI=null;try{navigator.vibrate&&navigator.vibrate(0)}catch(e){}const a=$('#alarm');a.hidden=true;a.className=''}
function fireAlarm(t){const A=alertCfg();stopAlarm();const msg=`הזמן נגמר!`,sub=t.label||'טיימר';
  if(A.sound){unlockAudio();beep();beepI=setInterval(beep,1200);setTimeout(()=>{clearInterval(beepI)},120000)}
  if(A.vib&&navigator.vibrate){try{navigator.vibrate([600,300,600,300,600]);vibI=setInterval(()=>navigator.vibrate([600,300,600,300,600]),3000);setTimeout(()=>clearInterval(vibI),60000)}catch(e){}}
  const a=$('#alarm');
  if(A.full){a.className='full';a.innerHTML=`<div><div class="al-ic">⏰</div><h2>${msg}</h2><p>${esc(sub)}</p><button class="sp-go" data-stopalarm>עצירה</button></div>`;a.hidden=false}
  else if(A.top){a.className='top';a.innerHTML=`<span>⏰ ${msg} ${esc(sub)}</span><button data-stopalarm>עצירה</button>`;a.hidden=false}
  else if(!A.sound&&!A.vib){toast('⏰ '+msg+' '+sub)}
  try{if(typeof Notification!=='undefined'&&Notification.permission==='granted'&&document.hidden){navigator.serviceWorker&&navigator.serviceWorker.ready.then(r=>r.showNotification('⏰ '+msg,{body:sub,vibrate:[600,300,600],requireInteraction:true,tag:'t'+t.id})).catch(()=>new Notification('⏰ '+msg,{body:sub}))}}catch(e){}}
function tick(){const now=Date.now();let changed=false;
  timers.forEach(t=>{if(!t.done&&!t.paused&&now>=t.end){t.done=true;changed=true;fireAlarm(t)}});
  if(changed)saveTimers();
  const act=timers.filter(t=>!t.done),c=$('#tchip');
  if(act.length){const t=act.slice().sort((a,b)=>(a.paused?a.left:a.end-now)-(b.paused?b.left:b.end-now))[0];c.innerHTML=`⏲ ${fmtT(t.paused?t.left:t.end-now)}${act.length>1?` <small>+${act.length-1}</small>`:''}`;c.hidden=false;
    if(!wl2&&navigator.wakeLock){navigator.wakeLock.request('screen').then(w=>wl2=w).catch(()=>{wl2=1})}}
  else{c.hidden=true;if(wl2&&wl2.release){wl2.release().catch(()=>{})}wl2=null}
  const pl=document.getElementById('tlist');if(pl)pl.innerHTML=timerRows()}
setInterval(tick,1000);
function timerRows(){const now=Date.now();const act=timers.filter(t=>!t.done);return act.length?act.map(t=>`<div class="trow"><div><b>${fmtT(t.paused?t.left:t.end-now)}</b><small>${esc(t.label||'טיימר')}</small></div><button class="btn" data-tadd="${t.id}">+1</button><button class="btn" data-tpause="${t.id}">${t.paused?'המשך':'השהיה'}</button><button class="btn" data-tdel="${t.id}">ביטול</button></div>`).join(''):'<p class="note">אין טיימרים פעילים</p>'}
function startTimer(min,label){unlockAudio();if(!(min>0))return;timers=timers.filter(t=>!t.done);timers.push({id:uid(),label,end:Date.now()+min*60000,dur:min});saveTimers();tick();toast(`טיימר ${min} דקות הופעל`);
  try{if(!window.claude&&typeof Notification!=='undefined'&&Notification.permission==='default')Notification.requestPermission()}catch(e){}}
function timerPanel(min='',label=''){const m=document.createElement('div');m.className='modal';
  m.innerHTML=`<div class="m"><h3 style="font-size:24px;margin-bottom:10px">⏲ טיימר</h3><div id="tlist">${timerRows()}</div>
  <h3 style="font-size:18px;margin:14px 0 6px">טיימר חדש</h3><input type="text" id="tlabel" placeholder="על מה? (למשל: העוגה בתנור)" value="${esc(label)}">
  <div class="tools" style="margin:10px 0">${[5,10,15,20,25,30,40,45,60].map(n=>`<button class="btn" data-tq="${n}">${n}</button>`).join('')}</div>
  <div class="tools" style="margin:0"><input type="number" id="tmin" inputmode="numeric" min="1" placeholder="דקות" value="${min}" style="width:110px;font-size:20px;padding:10px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg)"><button class="btn ok" data-tgo>הפעלה</button><button class="btn" data-n>סגירה</button></div></div>`;
  document.body.append(m);
  m.onclick=e=>{const b=e.target.closest('button');if(e.target===m||(b&&'n' in b.dataset)){m.remove();return}if(!b)return;const d=b.dataset;
    if(d.tq){m.querySelector('#tmin').value=d.tq}
    else if('tgo' in d){const v=parseFloat(m.querySelector('#tmin').value);if(!(v>0)){toast('כתוב כמה דקות');return}startTimer(v,m.querySelector('#tlabel').value.trim());m.remove()}
    else if(d.tdel){timers=timers.filter(t=>t.id!==d.tdel);saveTimers();tick()}
    else if(d.tadd){const t=timers.find(t=>t.id===d.tadd);if(t.paused)t.left+=60000;else t.end+=60000;saveTimers();tick()}
    else if(d.tpause){const t=timers.find(t=>t.id===d.tpause);if(t.paused){t.end=Date.now()+t.left;t.paused=false}else{t.left=t.end-Date.now();t.paused=true}saveTimers();tick()}}}
const INSTALL_TXT=`📲 איך מתקינים על המסך:\n\n🤖 אנדרואיד:\n1. פותחים את הקישור בכרום\n2. לוחצים על שלוש הנקודות למעלה\n3. בוחרים "הוספה למסך הבית" (או "התקנת אפליקציה")\n4. לוחצים "התקנה" — והאייקון יופיע במסך\n\n🍎 אייפון:\n1. פותחים את הקישור בספארי\n2. לוחצים על כפתור השיתוף (ריבוע עם חץ למעלה) בתחתית המסך\n3. גוללים ובוחרים "הוספה למסך הבית"\n4. לוחצים "הוסף" — והאייקון יופיע במסך`;
function shareApp(){const txt=`🍰 ${settings.name} — אפליקציית מתכונים עם מצרכים, שלבים, טיימר ורשימת קניות:\n${APP_URL}\n\n${INSTALL_TXT}`;const m=document.createElement('div');m.className='modal';
  m.innerHTML=`<div class="m"><h3 style="font-size:24px;margin-bottom:6px">שיתוף האפליקציה</h3><p class="note" style="direction:ltr;text-align:right;word-break:break-all">${APP_URL}</p><details style="margin:0 0 12px"><summary style="font-weight:700;cursor:pointer;padding:6px 0">📲 הסבר התקנה (נשלח יחד עם הקישור)</summary><div style="white-space:pre-line;font-size:15px;line-height:1.6">${esc(INSTALL_TXT)}</div></details><div class="f"><a class="btn ok" href="https://wa.me/?text=${encodeURIComponent(txt)}" target="_blank" rel="noopener">${ICON.wa} שליחה בוואטסאפ</a><button class="btn" data-copy>העתקת הקישור + ההסבר</button><button class="btn" data-native>שיתוף לאפליקציה אחרת</button><button class="btn" data-n>סגירה</button></div></div>`;
  document.body.append(m);m.onclick=async e=>{if(e.target===m||e.target.closest('[data-n]'))m.remove();
    else if(e.target.closest('[data-copy]')){try{await navigator.clipboard.writeText(txt);toast('הקישור וההסבר הועתקו')}catch(err){toast('לא הצלחתי להעתיק')}}
    else if(e.target.closest('[data-native]')){try{await navigator.share({title:settings.name,text:txt,url:APP_URL})}catch(err){try{await navigator.clipboard.writeText(txt);toast('הקישור הועתק')}catch(e2){}}}}}
document.addEventListener('click',e=>{if(e.target.closest('[data-stopalarm]'))stopAlarm()});
$('#tchip').onclick=()=>timerPanel();

/* ---------- events ---------- */
document.addEventListener('click',async e=>{
  const t=e.target.closest('button,[data-zoom]');if(!t)return;const d=t.dataset;
  if(d.zoom){zoom(d.zoom);return}
  if('cat' in d){view.cat=d.cat;rHome()}
  else if(d.open)go({v:'recipe',id:d.open,k:1,cook:false});
  else if('home' in d)go({v:'home'});
  else if(d.have!==undefined){const r=recipes.find(x=>x.id===view.id);r.have[d.have]=!r.have[d.have];saveAll();const y=scrollY;rRecipe();scrollTo(0,y)}
  else if(d.done!==undefined){const r=recipes.find(x=>x.id===view.id);r.done[d.done]=!r.done[d.done];saveAll();const y=scrollY;rRecipe();scrollTo(0,y)}
